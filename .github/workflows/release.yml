name: Release

# Versions the app from conventional commits on every push to main: bumps apps/web/package.json,
# writes CHANGELOG.md, tags vX.Y.Z and creates a GitHub Release. Then it brings main back into develop.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: patch, minor, major or an exact version. Leave empty to use conventional commits.
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t lint typecheck test build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NX_SPECIFIER: ${{ inputs.specifier }}
        run: |
          before=$(git rev-parse HEAD)
          args=(--skip-publish)
          if [ -n "$NX_SPECIFIER" ]; then args+=("$NX_SPECIFIER"); fi
          if [ -z "$(git tag --list 'v*')" ]; then
            # nx bumps even a first release, so 0.1.0 would ship as 0.1.1: the first one is run by hand.
            if [ -z "$NX_SPECIFIER" ]; then
              echo "::notice::No release tag yet. Run the Release workflow with the first version as specifier (for example 1.0.0)."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"
          if [ "$(git rev-parse HEAD)" != "$before" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the deploy that shows the new
      # version number is started by hand.
      - name: Deploy the new version
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      - name: Back-merge main into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main"
            exit 0
          fi
          if git merge-base --is-ancestor origin/develop origin/main; then
            git push origin origin/main:develop
            exit 0
          fi
          git push origin origin/main:refs/heads/chore/back-merge-main --force
          gh pr create --base develop --head chore/back-merge-main \
            --title "chore(release): back-merge main into develop" \
            --body "Brings the release commits and tags from main back into develop." \
            || gh pr list --head chore/back-merge-main --base develop
