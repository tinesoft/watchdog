name: Deploy

# Collects the sources, builds the site and publishes it to GitHub Pages: on every push to main,
# twice a day, and by hand. GitHub cron is UTC only, so 7AM and 2PM are 07:00 and 14:00 UTC.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7,14 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A Source that fails keeps its last published result, so a flaky feed never empties the site.
      - name: Sweep the sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: raises the NVD rate limit. Without it a Sweep takes a few minutes longer.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: pnpm nx collect web

      - run: pnpm nx build web --skip-nx-cache

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
